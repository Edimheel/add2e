name: Temporary illusionist JSON normalization

on:
  push:
    branches:
      - dev-tag-raciaux
    paths:
      - .github/workflows/tmp-fix-illusionniste-json.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-tag-raciaux
          fetch-depth: 0

      - name: Normalize Illusionniste in canonical class export
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("sources/export_classe_11072026.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          illusionniste = next((item for item in data.get("items", []) if item.get("name") == "Illusionniste" and item.get("type") == "classe"), None)
          if illusionniste is None:
              raise SystemExit("Classe Illusionniste introuvable")

          system = illusionniste.setdefault("system", {})

          # Même cohérence que le Clerc : maxSpellLevel et chaque ligne de progression
          # décrivent exactement le même nombre de niveaux de sorts.
          spellcasting = system.setdefault("spellcasting", {})
          spellcasting.update({
              "enabled": True,
              "mode": "arcane",
              "type": "prepared",
              "ability": "intelligence",
              "abilityKey": "int",
              "lists": ["Illusionniste"],
              "startsAt": 1,
              "maxSpellLevel": 7,
              "usesSlots": True,
              "usesPreparation": True,
              "preparationSource": "progression.spellsPerLevel"
          })
          system["spellLists"] = ["Illusionniste"]
          system["casterType"] = "arcane"
          system["casterAbility"] = "intelligence"
          system["spellcastingNote"] = "L’illusionniste prépare depuis son grimoire les sorts de la liste Illusionniste. Ses emplacements, limités aux niveaux de sort 1 à 7, sont lus dans progression[].spellsPerLevel."
          system["spellAccessRequirements"] = []

          for row in system.get("progression", []):
              slots = row.get("spellsPerLevel", [])
              if not isinstance(slots, list):
                  raise SystemExit(f"spellsPerLevel invalide au niveau {row.get('level', row.get('niveau'))}")
              row["spellsPerLevel"] = (slots + [0] * 7)[:7]

          # La règle mécanique existante est dague, bâton et fléchette.
          # Tous les textes et structures sont alignés dessus.
          allowed_weapons = ["type_arme:baton", "type_arme:dague", "type_arme:flechette"]
          system["weaponRestriction"] = {
              "mode": "allow-tags",
              "allowedTags": allowed_weapons,
              "forbiddenTags": [],
              "notes": "Illusionniste : bâton, dague et fléchette uniquement."
          }
          system["weaponsAllowed"] = allowed_weapons
          system["armes_autorisees"] = allowed_weapons
          system["weaponForbidden"] = []

          system["armorAllowed"] = []
          system["shieldAllowed"] = False
          system["armorRestriction"] = {
              "mode": "allow-tags",
              "allowedTags": [],
              "forbiddenTags": ["armure", "bouclier"],
              "notes": "Illusionniste : aucune armure ni aucun bouclier."
          }
          system["armorForbidden"] = ["armure", "bouclier"]
          system["armures_autorisees"] = []

          system["maxLevel"] = 20
          system["maxHitDice"] = 10
          system["hpAfter10"] = 1

          prerequis = system.setdefault("prerequis", {})
          prerequis["autre"] = "Aucune armure ni bouclier ; armes limitées au bâton, à la dague et à la fléchette ; accès à la liste Illusionniste."

          specials = system.get("specialAbilities", [])
          if isinstance(specials, list):
              system["specialAbilities"] = [
                  "Armes restreintes : bâton, dague et fléchette" if isinstance(value, str) and value.startswith("Armes restreintes") else value
                  for value in specials
              ]

          for feature in system.get("classFeatures", []):
              if feature.get("name") == "Restrictions d’armes":
                  feature["description"] = "L’illusionniste ne peut utiliser que le bâton, la dague et la fléchette."
                  feature["tags"] = ["armes:restreintes", "arme:baton", "arme:dague", "arme:flechette"]

          notes = system.get("ruleNotes", [])
          if isinstance(notes, list):
              system["ruleNotes"] = [
                  "Ses armes autorisées sont le bâton, la dague et la fléchette."
                  if isinstance(value, str) and value.startswith("Ses armes autorisées") else value
                  for value in notes
              ]

          system["classFeatureNote"] = "classFeatures décrit les règles de classe structurées. Seules les entrées activable:true sont affichées dans l’onglet Capacités ; les autres restent disponibles pour les moteurs et le résumé de classe."
          system["activeFeatureSystem"] = {
              "enabled": True,
              "displayRule": "activable:true uniquement dans l’onglet Capacités",
              "passiveRule": "passive:true ou activable:false = règle de classe non affichée comme capacité ou effet actif"
          }

          # Validation métier avant écriture.
          if spellcasting.get("maxSpellLevel") != 7:
              raise SystemExit("maxSpellLevel Illusionniste incorrect")
          bad_rows = [row.get("level", row.get("niveau")) for row in system.get("progression", []) if len(row.get("spellsPerLevel", [])) != 7]
          if bad_rows:
              raise SystemExit(f"Lignes de progression incohérentes : {bad_rows}")
          if system["weaponRestriction"]["allowedTags"] != allowed_weapons:
              raise SystemExit("Restriction d’armes incohérente")
          serialized = json.dumps(illusionniste, ensure_ascii=False).lower()
          if "arbalète légère" in serialized or "arbalete_legere" in serialized:
              raise SystemExit("Référence résiduelle à l’arbalète légère")

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit canonical JSON and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-illusionniste-json.yml
          git add sources/export_classe_11072026.json
          git commit -m "fix(classes): normalize illusionist canonical JSON"
          git push origin HEAD:dev-tag-raciaux
